<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gooey Nav</title>
<style>
  :root {
    --color-1: #ff6b6b;
    --color-2: #4dabf7;
    --color-3: #69db7c;
    --color-4: #ffd43b;
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0b0d;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .gooey-nav-container { position: relative; }

  .gooey-nav-container nav {
    display: flex;
    position: relative;
    transform: translate3d(0, 0, 0.01px);
  }

  .gooey-nav-container nav ul {
    display: flex;
    gap: 2em;
    list-style: none;
    padding: 0 1em;
    margin: 0;
    position: relative;
    z-index: 3;
    color: white;
    text-shadow: 0 1px 1px hsl(205deg 30% 10% / 0.2);
  }

  .gooey-nav-container nav ul li {
    border-radius: 100vw;
    position: relative;
    cursor: pointer;
    transition: background-color .3s ease, color .3s ease, box-shadow .3s ease;
    box-shadow: 0 0 0.5px 1.5px transparent;
    color: white;
  }

  .gooey-nav-container nav ul li a {
    display: inline-block;
    padding: 0.6em 1em;
    text-decoration: none;
    color: inherit;
  }

  .gooey-nav-container nav ul li:focus-within:has(:focus-visible) {
    box-shadow: 0 0 0.5px 1.5px white;
  }

  .gooey-nav-container nav ul li::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: white;
    opacity: 0;
    transform: scale(0);
    transition: all .3s ease;
    z-index: -1;
  }

  .gooey-nav-container nav ul li.active { color: black; text-shadow: none; }
  .gooey-nav-container nav ul li.active::after { opacity: 1; transform: scale(1); }

  .gooey-nav-container .effect {
    position: absolute;
    left: 0; top: 0; width: 0; height: 0;
    opacity: 1;
    pointer-events: none;
    display: grid;
    place-items: center;
    z-index: 1;
  }

  .gooey-nav-container .effect.text { color: white; transition: color .3s ease; }
  .gooey-nav-container .effect.text.active { color: black; }

  .gooey-nav-container .effect.filter { filter: blur(7px) contrast(100) blur(0); mix-blend-mode: lighten; }
  .gooey-nav-container .effect.filter::before { content: ''; position: absolute; inset: -75px; z-index: -2; background: black; }
  .gooey-nav-container .effect.filter::after { content: ''; position: absolute; inset: 0; background: white; transform: scale(0); opacity: 0; z-index: -1; border-radius: 100vw; }
  .gooey-nav-container .effect.active::after { animation: pill .3s ease both; }

  @keyframes pill { to { transform: scale(1); opacity: 1; } }

  .particle, .point { display: block; opacity: 0; width: 20px; height: 20px; border-radius: 100%; transform-origin: center; }
  .particle { --time: 5s; position: absolute; top: calc(50% - 8px); left: calc(50% - 8px); animation: particle calc(var(--time)) ease 1 -350ms; }
  .point { background: var(--color); opacity: 1; animation: point calc(var(--time)) ease 1 -350ms; }

  @keyframes particle {
    0% { transform: rotate(0deg) translate(calc(var(--start-x)), calc(var(--start-y))); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
    70% { transform: rotate(calc(var(--rotate) * .5)) translate(calc(var(--end-x) * 1.2), calc(var(--end-y) * 1.2)); opacity: 1; animation-timing-function: ease; }
    85% { transform: rotate(calc(var(--rotate) * .66)) translate(calc(var(--end-x)), calc(var(--end-y))); opacity: 1; }
    100% { transform: rotate(calc(var(--rotate) * 1.2)) translate(calc(var(--end-x) * .5), calc(var(--end-y) * .5)); opacity: 1; }
  }
  @keyframes point {
    0% { transform: scale(0); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
    25% { transform: scale(calc(var(--scale) * .25)); }
    38% { opacity: 1; }
    65% { transform: scale(var(--scale)); opacity: 1; animation-timing-function: ease; }
    85% { transform: scale(var(--scale)); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<div class="gooey-nav-container" id="gooeyRoot">
  <nav>
    <ul id="gooeyList"></ul>
  </nav>
  <span class="effect filter" id="gooeyFilter"></span>
  <span class="effect text" id="gooeyText"></span>
</div>

<script>
(function () {
  const items = [
    { label: 'Home', href: '#' },
    { label: 'About', href: '#' },
    { label: 'Contact', href: '#' }
  ];
  const animationTime = 600;
  const particleCount = 15;
  const particleDistances = [90, 10];
  const particleR = 100;
  const timeVariance = 300;
  const colors = [1, 2, 3, 1, 2, 3, 1, 4];
  let activeIndex = 0;

  const container = document.getElementById('gooeyRoot');
  const listEl = document.getElementById('gooeyList');
  const filterEl = document.getElementById('gooeyFilter');
  const textEl = document.getElementById('gooeyText');

  listEl.innerHTML = items.map((item, i) => `
    <li class="${i === 0 ? 'active' : ''}" data-i="${i}">
      <a href="${item.href}">${item.label}</a>
    </li>
  `).join('');

  function noise(n) { n = n === undefined ? 1 : n; return n / 2 - Math.random() * n; }

  function getXY(distance, pointIndex, totalPoints) {
    const angle = ((360 + noise(8)) / totalPoints) * pointIndex * (Math.PI / 180);
    return [distance * Math.cos(angle), distance * Math.sin(angle)];
  }

  function createParticle(i, t, d, r) {
    let rotate = noise(r / 10);
    return {
      start: getXY(d[0], particleCount - i, particleCount),
      end: getXY(d[1] + noise(7), particleCount - i, particleCount),
      time: t,
      scale: 1 + noise(0.2),
      color: colors[Math.floor(Math.random() * colors.length)],
      rotate: rotate > 0 ? (rotate + r / 20) * 10 : (rotate - r / 20) * 10
    };
  }

  function makeParticles(element) {
    const d = particleDistances;
    const r = particleR;
    const bubbleTime = animationTime * 2 + timeVariance;
    element.style.setProperty('--time', `${bubbleTime}ms`);

    for (let i = 0; i < particleCount; i++) {
      const t = animationTime * 2 + noise(timeVariance * 2);
      const p = createParticle(i, t, d, r);
      element.classList.remove('active');

      setTimeout(() => {
        const particle = document.createElement('span');
        const point = document.createElement('span');
        particle.classList.add('particle');
        particle.style.setProperty('--start-x', `${p.start[0]}px`);
        particle.style.setProperty('--start-y', `${p.start[1]}px`);
        particle.style.setProperty('--end-x', `${p.end[0]}px`);
        particle.style.setProperty('--end-y', `${p.end[1]}px`);
        particle.style.setProperty('--time', `${p.time}ms`);
        particle.style.setProperty('--scale', `${p.scale}`);
        particle.style.setProperty('--color', `var(--color-${p.color}, white)`);
        particle.style.setProperty('--rotate', `${p.rotate}deg`);

        point.classList.add('point');
        particle.appendChild(point);
        element.appendChild(particle);
        requestAnimationFrame(() => { element.classList.add('active'); });
        setTimeout(() => {
          try { element.removeChild(particle); } catch (e) {}
        }, t);
      }, 30);
    }
  }

  function updateEffectPosition(element) {
    const containerRect = container.getBoundingClientRect();
    const pos = element.getBoundingClientRect();
    const styles = {
      left: `${pos.x - containerRect.x}px`,
      top: `${pos.y - containerRect.y}px`,
      width: `${pos.width}px`,
      height: `${pos.height}px`
    };
    Object.assign(filterEl.style, styles);
    Object.assign(textEl.style, styles);
    textEl.innerText = element.innerText;
  }

  function handleClick(liEl, index) {
    if (activeIndex === index) return;
    activeIndex = index;

    listEl.querySelectorAll('li').forEach((li, i) => li.classList.toggle('active', i === index));
    updateEffectPosition(liEl);

    filterEl.querySelectorAll('.particle').forEach((p) => filterEl.removeChild(p));

    textEl.classList.remove('active');
    void textEl.offsetWidth;
    textEl.classList.add('active');

    makeParticles(filterEl);
  }

  listEl.querySelectorAll('li').forEach((li) => {
    const i = Number(li.dataset.i);
    const a = li.querySelector('a');
    a.addEventListener('click', (e) => { e.preventDefault(); handleClick(li, i); });
    a.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleClick(li, i); }
    });
  });

  const initialActiveLi = listEl.querySelectorAll('li')[activeIndex];
  if (initialActiveLi) {
    updateEffectPosition(initialActiveLi);
    textEl.classList.add('active');
  }

  new ResizeObserver(() => {
    const currentActiveLi = listEl.querySelectorAll('li')[activeIndex];
    if (currentActiveLi) updateEffectPosition(currentActiveLi);
  }).observe(container);
})();
</script>
</body>
</html>
